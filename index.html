<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alphabet Pair Match! (Direct Mode)</title>
    <style>
        :root { --pink: #f8a5c2; --blue: #778beb; --bg: #fffbe6; --gold: #feca57; }
        body { font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif; background-color: var(--bg); text-align: center; margin: 0; padding: 10px; overflow-x: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .container { max-width: 600px; margin: auto; padding: 25px; background: white; border-radius: 40px; box-shadow: 0 15px 0 #f0e68c; min-height: 90vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 標題與五星成就 */
        .header { color: #54a0ff; font-size: 32px; font-weight: bold; margin-bottom: 5px; text-shadow: 2px 2px #e3f2fd; }
        .stars { font-size: 45px; color: var(--gold); margin-bottom: 15px; min-height: 55px; letter-spacing: 5px; }
        .victory-glow { animation: victoryPulse 1s infinite alternate; }
        @keyframes victoryPulse { from { transform: scale(1); } to { transform: scale(1.2); text-shadow: 0 0 20px #feca57; } }

        /* 遊戲核心互動區 */
        .game-main { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* 調整 LISTEN 按鈕置底的樣式與間距 */
        .listen-btn { background: white; border: 3px solid #54a0ff; color: #54a0ff; border-radius: 30px; padding: 12px 50px; cursor: pointer; font-weight: bold; font-size: 24px; margin-top: 30px; -webkit-appearance: none; box-shadow: 0 4px 0 #e3f2fd; }
        .listen-btn:active { background: #54a0ff; color: white; transform: translateY(2px); box-shadow: none; }

        /* 中央大寫卡片提示 */
        .card-display { font-size: 95px; color: #ff9f43; font-weight: bold; background: #fff3e0; border: 5px dashed #ffb74d; display: inline-block; padding: 10px 50px; border-radius: 25px; margin: 10px 0; box-shadow: 0 8px 0 #ffe0b2; }

        /* 核心小寫圓圈按鈕（粉紅、粉藍球球） */
        .choice-container { display: flex; justify-content: space-around; align-items: center; width: 100%; margin: 20px 0; }
        .circle-btn { width: 160px; height: 160px; border-radius: 50%; border: none; font-size: 85px; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: 0 10px 0 rgba(0,0,0,0.1); -webkit-appearance: none; }
        .circle-btn.pink { background-color: var(--pink); }
        .circle-btn.blue { background-color: var(--blue); }
        .circle-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(0,0,0,0.1); }

        /* 下方功能控制區 */
        .action-area { margin-top: 20px; background: #f9f9f9; border-radius: 20px; padding: 20px; width: 100%; }
        .action-btn { border-radius: 40px; border: none; padding: 15px 30px; font-size: 20px; color: white; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-weight: bold; -webkit-appearance: none; }
        .rec-btn { background-color: #ff6b6b; box-shadow: 0 4px #ee5253; }
        .play-btn { background-color: #1dd1a1; box-shadow: 0 4px #10ac84; }
        .recording-text { color: #ff6b6b; font-weight: bold; margin: 10px; font-size: 20px; display: none; }
        
        .next-btn { margin-top: 25px; border: none; background: #54a0ff; color: white; border-radius: 25px; padding: 12px 50px; font-size: 24px; cursor: pointer; font-weight: bold; box-shadow: 0 5px #2e86de; -webkit-appearance: none; }

        .hidden { display: none !important; }
        .blink { animation: blinker 0.8s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div>
        <h2 class="header">Pair Match! 🚀</h2>
        <div class="stars" id="star-display">☆☆☆☆☆</div>
    </div>

    <div class="game-main">
        <div id="quiz-area" style="width:100%; display: flex; flex-direction: column; align-items: center;">
            <div id="target-card" class="card-display"></div>
            <p style="color: #666; font-weight: bold; font-size: 18px; margin: 5px 0;">Find the matching lowercase letter! 👇</p>
            
            <div class="choice-container">
                <button id="opt1" class="circle-btn pink" onclick="checkAnswer(this)"></button>
                <button id="opt2" class="circle-btn blue" onclick="checkAnswer(this)"></button>
            </div>

            <button class="listen-btn" onclick="playSound()">🔊 LISTEN</button>
        </div>

        <div id="recording-status" class="recording-text blink">🔴 RECORDING...</div>

        <div id="feedback-area" class="hidden" style="width:100%;">
            <p style="color:#1dd1a1; font-weight:bold; font-size:22px; margin: 10px 0;">🎉 MATCHED! GREAT JOB!</p>
            <div class="action-area">
                <button id="recBtn" class="action-btn rec-btn" 
                        onmousedown="startRec(event)" onmouseup="stopRec(event)" 
                        ontouchstart="startRec(event)" ontouchend="stopRec(event)">🎤 HOLD TO RECORD</button>
                <button id="playRecBtn" class="action-btn play-btn hidden" onclick="playBack()">▶ MY VOICE</button>
            </div>
            <button class="next-btn" onclick="nextRound()">NEXT ➔</button>
        </div>
    </div>

    <div style="color: #bbb; font-size: 14px; font-weight: bold; text-transform: uppercase;">Direct Pair Mode</div>
</div>

<script>
    // 26組大小寫字母配對資料庫
    const alphabetPairs = [
        { U: "A", L: "a" }, { U: "B", L: "b" }, { U: "C", L: "c" }, { U: "D", L: "d" },
        { U: "E", L: "e" }, { U: "F", L: "f" }, { U: "G", L: "g" }, { U: "H", L: "h" },
        { U: "I", L: "i" }, { U: "J", L: "j" }, { U: "K", L: "k" }, { U: "L", L: "l" },
        { U: "M", L: "m" }, { U: "N", L: "n" }, { U: "O", L: "o" }, { U: "P", L: "p" },
        { U: "Q", L: "q" }, { U: "R", L: "r" }, { U: "S", L: "s" }, { U: "T", L: "t" },
        { U: "U", L: "u" }, { U: "V", L: "v" }, { U: "W", L: "w" }, { U: "X", L: "x" },
        { U: "Y", L: "y" }, { U: "Z", L: "z" }
    ];

    let currentIndex = 0, score = 0, mediaRecorder, audioChunks = [], audioUrl;

    // 直接出題與換題邏輯
    function nextRound() {
        currentIndex = Math.floor(Math.random() * alphabetPairs.length);
        const currentPair = alphabetPairs[currentIndex];
        
        document.getElementById('target-card').innerText = currentPair.U;
        
        const others = alphabetPairs.filter((p, idx) => idx !== currentIndex);
        const distractor = others[Math.floor(Math.random() * others.length)].L;

        const options = [currentPair.L, distractor].sort(() => Math.random() - 0.5);
        document.getElementById('opt1').innerText = options[0];
        document.getElementById('opt2').innerText = options[1];
        
        document.getElementById('opt1').style.opacity = "1";
        document.getElementById('opt2').style.opacity = "1";
        document.getElementById('feedback-area').classList.add('hidden');
        document.getElementById('quiz-area').classList.remove('hidden');
        document.getElementById('playRecBtn').classList.add('hidden');
        document.getElementById('recording-status').style.display = 'none';
        document.getElementById('star-display').classList.remove('victory-glow');
        updateStars();
        
        // 進入新回合自動呼叫語音
        setTimeout(playSound, 300);
    }

    function playSound() { speak(alphabetPairs[currentIndex].U); }
    function speak(t) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'en-US'; m.rate = 0.75; window.speechSynthesis.speak(m); }

    function checkAnswer(el) {
        if (el.innerText === alphabetPairs[currentIndex].L) {
            score++;
            updateStars();
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('feedback-area').classList.remove('hidden');
            
            if (score > 0 && score % 5 === 0) {
                document.getElementById('star-display').classList.add('victory-glow');
                playVictoryMusic();
            } else {
                playSimpleDing();
            }
        } else {
            speak("Try again");
            el.style.opacity = "0.3";
        }
    }

    function updateStars() {
        let s = (score % 5 === 0 && score !== 0) ? 5 : score % 5;
        document.getElementById('star-display').innerText = "★".repeat(s) + "☆".repeat(5-s);
    }

    // Final Fantasy 經典過關慶祝音樂
    function playVictoryMusic() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const melody = [
            {f: 523, d: 0.15}, {f: 523, d: 0.15}, {f: 523, d: 0.15}, {f: 523, d: 0.4},
            {f: 415, d: 0.4}, {f: 466, d: 0.4}, {f: 523, d: 0.2}, {f: 466, d: 0.15}, {f: 523, d: 1.0}
        ];
        let now = ctx.currentTime;
        melody.forEach(n => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.type = 'square'; o.frequency.value = n.f; o.connect(g); g.connect(ctx.destination);
            g.gain.setValueAtTime(0.05, now); g.gain.exponentialRampToValueAtTime(0.001, now + n.d);
            o.start(now); o.stop(now + n.d); now += n.d;
        });
    }

    function playSimpleDing() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.frequency.setValueAtTime(523, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(659, ctx.currentTime + 0.1);
        g.gain.setValueAtTime(0.05, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        o.start(); o.stop(ctx.currentTime + 0.3);
    }

    // iOS & Android 雙平台錄音格式自適應優化
    function initMediaRecorder(stream) {
        let options = { mimeType: 'audio/webm' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'audio/mp4' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = {};
            }
        }
        mediaRecorder = new MediaRecorder(stream, options);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
            audioUrl = URL.createObjectURL(audioBlob);
            document.getElementById('playRecBtn').classList.remove('hidden');
        };
    }

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        initMediaRecorder(stream);
    }).catch(err => console.log("Mic initialized."));

    function startRec(e) { 
        if(e) e.preventDefault();
        if (!mediaRecorder || mediaRecorder.state === "recording") return;
        audioChunks = []; 
        mediaRecorder.start(); 
        document.getElementById('recording-status').style.display = 'block'; 
    }
    
    function stopRec(e) { 
        if(e) e.preventDefault();
        if (!mediaRecorder || mediaRecorder.state !== "recording") return;
        mediaRecorder.stop(); 
        document.getElementById('recording-status').style.display = 'none'; 
    }
    
    function playBack() { if(audioUrl) { new Audio(audioUrl).play(); } }

    window.onload = nextRound;
</script>
</body>
</html>
